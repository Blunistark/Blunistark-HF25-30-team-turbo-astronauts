<!DOCTYPE html>
<html>
<head>
  <title>UATM Drone Map Simulation</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    #map { height: 100vh; width: 100%; }
    #debug { position: fixed; top: 10px; left: 10px; background: white; padding: 10px; z-index: 1000; max-height: 80vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="debug"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Debug function
    function debug(msg) {
      const debugDiv = document.getElementById('debug');
      debugDiv.innerHTML += msg + '<br>';
      console.log(msg);
    }

    // Function to process Excel data
    function processExcelData(data, filename) {
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(firstSheet);
      debug(`Processed ${filename}: ${jsonData.length} rows`);
      return jsonData;
    }

    // Wait for the page to fully load
    window.onload = function() {
      try {
        debug('Page loaded, initializing map...');
        
        // Check if Leaflet is loaded
        if (typeof L === 'undefined') {
          throw new Error('Leaflet library not loaded!');
        }
        debug('Leaflet library loaded successfully');

        // Initialize map with a wider view to ensure we can see all drones
        const map = L.map('map').setView([13.2, 77.8], 10);
        debug('Map initialized');

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        debug('Tile layer added');

        // Create a layer group for all markers
        const allMarkersLayer = L.layerGroup().addTo(map);
        debug('Marker layer group created');

        // Load dataset files
        fetch('dataset/large/Map_Data_Large_with_Geofencing.xlsx')
          .then(response => response.arrayBuffer())
          .then(data => {
            const mapData = processExcelData(data, 'Map Data');
            debug('Map data loaded successfully');
            
            // Process geofencing data
            mapData.forEach(zone => {
              if (zone.latitude && zone.longitude && zone.radius) {
                const circle = L.circle([zone.latitude, zone.longitude], {
                  color: 'red',
                  fillColor: '#f03',
                  fillOpacity: 0.1,
                  radius: zone.radius * 1000 // Convert km to meters
                }).addTo(allMarkersLayer);
                
                circle.bindPopup(`Geofence: ${zone.name || 'Unnamed Zone'}<br>Radius: ${zone.radius}km`);
              }
            });
          })
          .catch(error => {
            debug('Error loading map data: ' + error.message);
          });

        fetch('dataset/large/Delivery_Drones_Large_Dataset.xlsx')
          .then(response => response.arrayBuffer())
          .then(data => {
            const deliveryData = processExcelData(data, 'Delivery Drones');
            debug('Delivery drones data loaded successfully');
            
            // Process delivery drones
            deliveryData.forEach(drone => {
              if (drone.latitude && drone.longitude) {
                const marker = L.marker([drone.latitude, drone.longitude], {
                  icon: L.divIcon({
                    className: 'drone-icon',
                    html: '📦',
                    iconSize: [20, 20]
                  })
                }).addTo(allMarkersLayer);
                
                marker.bindPopup(`
                  Delivery Drone ID: ${drone.drone_id || 'Unknown'}<br>
                  Status: ${drone.status || 'Unknown'}<br>
                  Altitude: ${drone.altitude || 'Unknown'}m<br>
                  Speed: ${drone.speed || 'Unknown'}km/h
                `);
              }
            });
          })
          .catch(error => {
            debug('Error loading delivery drones data: ' + error.message);
          });

        fetch('dataset/large/Surveillance_Drones_Large_Dataset.xlsx')
          .then(response => response.arrayBuffer())
          .then(data => {
            const surveillanceData = processExcelData(data, 'Surveillance Drones');
            debug('Surveillance drones data loaded successfully');
            
            // Process surveillance drones
            surveillanceData.forEach(drone => {
              if (drone.latitude && drone.longitude) {
                const marker = L.marker([drone.latitude, drone.longitude], {
                  icon: L.divIcon({
                    className: 'drone-icon',
                    html: '📹',
                    iconSize: [20, 20]
                  })
                }).addTo(allMarkersLayer);
                
                marker.bindPopup(`
                  Surveillance Drone ID: ${drone.drone_id || 'Unknown'}<br>
                  Status: ${drone.status || 'Unknown'}<br>
                  Altitude: ${drone.altitude || 'Unknown'}m<br>
                  Coverage Area: ${drone.coverage_area || 'Unknown'}km²
                `);
              }
            });
          })
          .catch(error => {
            debug('Error loading surveillance drones data: ' + error.message);
          });

        // Bases
        const bases = [
          ["Base Alpha", 13.03, 77.58],
          ["Base Beta", 13.06, 77.61],
          ["Base Gamma", 12.99, 77.62],
          ["Base Delta", 13.01, 77.59],
          ["Base Epsilon", 13.07, 77.63]
        ];
        bases.forEach(([name, lat, lon]) => {
          L.marker([lat, lon], { title: name })
            .addTo(allMarkersLayer)
            .bindPopup(`<b>${name}</b><br>Base Location`);
        });
        debug('Bases added');

        // Charging Ports - Key locations in Bangalore (adjusted to avoid drone overlap)
        const ports = [
          ["Port A", 13.1027, 77.6077],  // Richards Town (North of Ulsoor)
          ["Port B", 13.0532, 77.5178],  // Hanumanth Nagar (South of Basavanagudi)
          ["Port C", 13.1432, 77.5399],  // RT Nagar (North of Sahakar Nagar)
          ["Port D", 12.9416, 77.5746],  // Hongasandra (South of Bommanahalli)
          ["Port E", 13.0472, 77.5113],  // Girinagar (South of Padmanabhanagar)
          ["Port F", 13.1889, 77.6177],  // Kadugodi (North of Hoodi)
          ["Port G", 12.8949, 77.5850],  // Singasandra (South of Konappana Agrahara)
          ["Port H", 13.1004, 77.6471],  // Sarjapur (East of Varthur)
          ["Port I", 13.0489, 77.4475],  // Rajarajeshwari Nagar (West of Kengeri)
          ["Port J", 13.1247, 77.6547],  // Horamavu (North of Hennur)
          ["Port K", 13.0853, 77.5740],  // Austin Town (East of Domlur)
          ["Port L", 13.0498, 77.5113],  // Shanthi Nagar (South of Basavanagudi)
          ["Port M", 13.0927, 77.5677],  // Richmond Town (South of Wilson Garden)
          ["Port N", 13.0632, 77.5078],  // Wilson Garden (South of Madiwala)
          ["Port O", 13.1532, 77.5299]   // Jakkur (North of Thanisandra)
        ];

        debug('Adding charging ports...');
        ports.forEach(([name, lat, lon], index) => {
          const portMarker = L.circleMarker([lat, lon], { 
            radius: 10,  // Increased size for better visibility
            color: 'green',
            fillColor: 'green',
            fillOpacity: 0.9,
            weight: 2
          });
          
          portMarker.addTo(allMarkersLayer);
          portMarker.bindPopup(`<b>${name}</b><br>Charging Port<br>Location: ${lat.toFixed(4)}, ${lon.toFixed(4)}`);
          debug(`Added charging port ${name} at [${lat}, ${lon}]`);
        });
        debug('All charging ports added');

        // Restricted Zones
        const zones = [
          { name: "Airport Zone", sw: [13.197, 77.706], ne: [13.205, 77.718] },
          { name: "Military Area", sw: [12.970, 77.590], ne: [12.975, 77.600] },
          { name: "Vidhana Soudha Perimeter", sw: [12.979, 77.591], ne: [12.984, 77.596] },
          { name: "Tech Park Zone", sw: [13.042, 77.615], ne: [13.048, 77.625] },
          { name: "Railway Zone", sw: [12.960, 77.575], ne: [12.970, 77.585] }
        ];
        zones.forEach(({ name, sw, ne }) => {
          L.rectangle([sw, ne], {
            color: "red",
            weight: 2,
            fillOpacity: 0.3
          }).addTo(map).bindPopup(`<b>${name}</b><br>Restricted Zone`);
        });
        debug('Restricted zones added');

        // Drones
        const drones = [
          // Surveillance Drones
          { id: "SRV_013", type: "Surveillance", lat: 13.0827, lon: 77.5877, state: "Patrolling", battery: 93.5, zone: "Central Bangalore" },  // MG Road area
          { id: "SRV_011", type: "Surveillance", lat: 13.0232, lon: 77.5478, state: "Patrolling", battery: 73.0, zone: "South Bangalore" },  // JP Nagar
          { id: "SRV_014", type: "Surveillance", lat: 13.1489, lon: 77.6177, state: "Patrolling", battery: 67.2, zone: "North-East Bangalore" }, // Whitefield
          { id: "SRV_015", type: "Surveillance", lat: 13.0604, lon: 77.6271, state: "Patrolling", battery: 82.1, zone: "East Bangalore" },      // Marathahalli
          { id: "SRV_016", type: "Surveillance", lat: 13.0847, lon: 77.6347, state: "Patrolling", battery: 88.3, zone: "North-East Bangalore" }, // KR Puram

          // Delivery Drones
          { id: "DRN_001", type: "Delivery", lat: 13.0927, lon: 77.5977, state: "In transit", battery: 85.4, zone: "Central Bangalore" },      // Ulsoor
          { id: "DRN_002", type: "Delivery", lat: 12.9716, lon: 77.5946, state: "In transit", battery: 53.5, zone: "South-East Bangalore" }, // HSR Layout
          { id: "DRN_003", type: "Delivery", lat: 13.0332, lon: 77.5378, state: "In transit", battery: 78.2, zone: "South Bangalore" },      // Basavanagudi
          { id: "DRN_004", type: "Delivery", lat: 13.1232, lon: 77.5599, state: "In transit", battery: 62.8, zone: "North Bangalore" },     // Sahakar Nagar
          { id: "DRN_005", type: "Delivery", lat: 12.9616, lon: 77.5846, state: "In transit", battery: 45.6, zone: "South Bangalore" },     // Bommanahalli
          { id: "DRN_006", type: "Delivery", lat: 13.1132, lon: 77.5699, state: "In transit", battery: 46.4, zone: "North Bangalore" },     // Hebbal
          { id: "DRN_007", type: "Delivery", lat: 12.9349, lon: 77.6050, state: "In transit", battery: 78.5, zone: "South-East Bangalore" }, // Electronic City
          { id: "DRN_008", type: "Delivery", lat: 13.0089, lon: 77.4875, state: "In transit", battery: 45.8, zone: "West Bangalore" },      // Mysore Road
          { id: "DRN_009", type: "Delivery", lat: 13.0272, lon: 77.5313, state: "In transit", battery: 91.2, zone: "South Bangalore" },      // Padmanabhanagar
          { id: "DRN_010", type: "Delivery", lat: 13.0072, lon: 77.5513, state: "In transit", battery: 83.9, zone: "South-West Bangalore" }, // Banashankari
          { id: "DRN_011", type: "Delivery", lat: 13.1689, lon: 77.6277, state: "In transit", battery: 72.3, zone: "North-East Bangalore" }, // Hoodi
          { id: "DRN_012", type: "Delivery", lat: 12.9149, lon: 77.5950, state: "In transit", battery: 68.7, zone: "South Bangalore" },      // Konappana Agrahara
          { id: "DRN_013", type: "Delivery", lat: 13.0804, lon: 77.6371, state: "In transit", battery: 55.4, zone: "East Bangalore" },      // Varthur
          { id: "DRN_014", type: "Delivery", lat: 13.0289, lon: 77.4675, state: "In transit", battery: 49.8, zone: "West Bangalore" },      // Kengeri
          { id: "DRN_015", type: "Delivery", lat: 13.1047, lon: 77.6447, state: "In transit", battery: 77.6, zone: "North Bangalore" }       // Hennur
        ];
        
        debug('Adding drones...');
        drones.forEach(drone => {
          const color = drone.type === "Surveillance" ? "purple" : "blue";
          const marker = L.circleMarker([drone.lat, drone.lon], {
            radius: 8,
            color: color,
            fillColor: color,
            fillOpacity: 0.9,
            weight: 2
          }).addTo(allMarkersLayer);
          
          marker.bindPopup(`
            <b>${drone.id}</b><br>
            Type: ${drone.type}<br>
            State: ${drone.state}<br>
            Battery: ${drone.battery}%<br>
            Zone: ${drone.zone}
          `);
          
          debug(`Added drone ${drone.id} at [${drone.lat}, ${drone.lon}]`);
        });
        debug('All drones added');

        // Fit map bounds to show all markers
        const bounds = allMarkersLayer.getBounds();
        map.fitBounds(bounds, { padding: [50, 50] });
        debug('Map bounds adjusted to show all markers');

        // Add legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function(map) {
          const div = L.DomUtil.create('div', 'info legend');
          div.innerHTML = `
            <h4>Drone Types</h4>
            <div><span style="font-size: 20px;">📦</span> Delivery Drone</div>
            <div><span style="font-size: 20px;">📹</span> Surveillance Drone</div>
            <div><span style="color: red;">●</span> Geofence Zone</div>
          `;
          return div;
        };
        legend.addTo(map);

      } catch (error) {
        debug('Error: ' + error.message);
        console.error(error);
      }
    };
  </script>
</body>
</html>
